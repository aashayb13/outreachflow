# ─────────────────────────────────────────────────────────────────
# Render Blueprint (canonical) for the outbound-flow-marcus repo.
#
# The actual app lives in the email-campaign-tool/ subdirectory, so we
# use rootDir to point Render at it. Render Blueprints MUST be at the
# repo root, which is why this file exists in addition to the inner
# email-campaign-tool/render.yaml.
#
# Deployment (all free):
#   1. Create a free Supabase Postgres and copy its "Session pooler"
#      connection string. Full steps: email-campaign-tool/DEPLOY-OUTREACHFLOW.md.
#   2. Push this repo to GitHub.
#   3. In Render: New + → Blueprint → connect this repo.
#   4. Render detects this file and provisions 1 web service (email-campaign-tool).
#   5. Fill in the env vars marked `sync: false` in the Render UI — including
#      DATABASE_URL (the Supabase Session-pooler string, with your password).
#   6. Hit Deploy.
#
# See email-campaign-tool/DEPLOY.md for the full step-by-step.
#
# ⚠️  FREE-TIER NOTES (plan: free is set below):
#   • The web service SLEEPS after 15 min of no HTTP traffic (~1 min cold start
#     on wake). "Send now" from the dashboard works fine. Time-based sending
#     (scheduled campaigns / drip sequences) is DISABLED in code because of this
#     — see the commented-out startScheduler() in src/server.js. To enable it
#     later, move to a paid always-on instance (or keep the app awake with an
#     uptime pinger hitting /health every ~10 min) and uncomment that line.
#   • The database is an EXTERNAL free Supabase Postgres — persistent, it does
#     NOT expire the way Render's own free Postgres does. Set DATABASE_URL below.
# ─────────────────────────────────────────────────────────────────

services:
  - type: web
    name: email-campaign-tool
    runtime: node
    plan: free               # free web service — sleeps after 15 min idle
    region: oregon
    rootDir: email-campaign-tool
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"

      # ⚠️  APP_SECRET must be set manually — DO NOT use generateValue.
      # Used to encrypt integration credentials and sign JWTs.
      - key: APP_SECRET
        sync: false

      # Dashboard login (set both manually)
      - key: APP_EMAIL
        sync: false
      - key: APP_PASSWORD
        sync: false

      - key: BASE_URL
        sync: false

      # Postgres — EXTERNAL free Supabase DB (persistent). Set this in the
      # Render UI to your Supabase "Session pooler" connection string
      # (Supabase → Project → Connect → Session pooler, port 5432), with your
      # DB password filled in. SSL is applied automatically for non-localhost
      # hosts by src/db/connection.js — no ?sslmode flag needed.
      - key: DATABASE_URL
        sync: false

      # ─── SMTP (set after you have credentials) ──────────────────
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false

      # ─── Optional: master API key for /api/* (X-API-Key header) ──
      - key: API_KEY
        sync: false

      - key: WEBHOOK_SECRET
        generateValue: true

      - key: TRACKING_DOMAIN
        sync: false

      - key: SEND_RATE_PER_SECOND
        value: "1"
      - key: SEND_RATE_PER_DAY
        value: "40"

      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"
