# ─────────────────────────────────────────────────────────────────
# Render Blueprint (canonical) for the outbound-flow-marcus repo.
#
# The actual app lives in the email-campaign-tool/ subdirectory, so we
# use rootDir to point Render at it. Render Blueprints MUST be at the
# repo root, which is why this file exists in addition to the inner
# email-campaign-tool/render.yaml.
#
# Deployment:
#   1. Push this repo to GitHub.
#   2. In Render: New + → Blueprint → connect this repo.
#   3. Render will detect this file and provision:
#       - 1 web service (email-campaign-tool)
#       - 1 managed Postgres database (email-campaign-db)
#   4. Fill in the env vars marked `sync: false` in the Render UI.
#   5. Hit Deploy.
#
# See email-campaign-tool/DEPLOY.md for the full step-by-step.
# ─────────────────────────────────────────────────────────────────

databases:
  - name: email-campaign-db
    plan: basic-256mb        # cheapest paid Postgres tier on Render
    region: oregon
    databaseName: email_campaign
    user: email_campaign

services:
  - type: web
    name: email-campaign-tool
    runtime: node
    plan: starter
    region: oregon
    rootDir: email-campaign-tool
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"

      # ⚠️  APP_SECRET must be set manually — DO NOT use generateValue.
      # Used to encrypt integration credentials and sign JWTs.
      - key: APP_SECRET
        sync: false

      # Dashboard login (set both manually)
      - key: APP_EMAIL
        sync: false
      - key: APP_PASSWORD
        sync: false

      - key: BASE_URL
        sync: false

      # Postgres — wired automatically from the database service above
      - key: DATABASE_URL
        fromDatabase:
          name: email-campaign-db
          property: connectionString

      # ─── SMTP (set after you have credentials) ──────────────────
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false

      # ─── Optional: master API key for /api/* (X-API-Key header) ──
      - key: API_KEY
        sync: false

      - key: WEBHOOK_SECRET
        generateValue: true

      - key: TRACKING_DOMAIN
        sync: false

      - key: SEND_RATE_PER_SECOND
        value: "1"
      - key: SEND_RATE_PER_DAY
        value: "40"

      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"
