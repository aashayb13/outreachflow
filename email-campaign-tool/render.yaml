# Render manifest for the email-campaign-tool service.
#
# The canonical Blueprint lives at the repo root (../render.yaml). This
# file is the inline reference used when creating a Web Service manually
# from the Render UI and pointing it at this subdirectory.

# ⚠️  Instance = paid Starter (always-on); SMTP ports 587/465 work (Render's
#     FREE tier blocks them). Time-based sending (scheduler) is commented out in
#     src/server.js by preference — re-enable via startScheduler() anytime.
#     Database is an EXTERNAL Supabase Postgres (persistent). See ../render.yaml.

services:
  - type: web
    name: email-campaign-tool
    runtime: node
    plan: starter            # paid, always-on; SMTP 587/465 unblocked, no sleep
    region: oregon
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"

      # APP_SECRET — used to encrypt integration credentials and sign JWTs.
      # Set manually; never use generateValue here.
      - key: APP_SECRET
        sync: false

      # Dashboard login (set both manually)
      - key: APP_EMAIL
        sync: false
      - key: APP_PASSWORD
        sync: false

      - key: BASE_URL
        sync: false

      # EXTERNAL free Supabase DB. Set to your Supabase "Session pooler"
      # connection string (port 5432) with your DB password. SSL is handled
      # automatically for non-localhost hosts by src/db/connection.js.
      - key: DATABASE_URL
        sync: false

      # SMTP — set after you have Gmail App Password / Mailgun / SendGrid creds
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false

      # Optional: master API key for programmatic access (X-API-Key header)
      - key: API_KEY
        sync: false

      - key: WEBHOOK_SECRET
        generateValue: true

      - key: TRACKING_DOMAIN
        sync: false

      - key: SEND_RATE_PER_SECOND
        value: "1"
      - key: SEND_RATE_PER_DAY
        value: "40"

      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"
