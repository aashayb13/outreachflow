# Render manifest for the email-campaign-tool service.
#
# The canonical Blueprint lives at the repo root (../render.yaml). This
# file is the inline reference used when creating a Web Service manually
# from the Render UI and pointing it at this subdirectory.

databases:
  - name: email-campaign-db
    plan: basic-256mb
    region: oregon
    databaseName: email_campaign
    user: email_campaign

services:
  - type: web
    name: email-campaign-tool
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"

      # APP_SECRET — used to encrypt integration credentials and sign JWTs.
      # Set manually; never use generateValue here.
      - key: APP_SECRET
        sync: false

      # Dashboard login (set both manually)
      - key: APP_EMAIL
        sync: false
      - key: APP_PASSWORD
        sync: false

      - key: BASE_URL
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: email-campaign-db
          property: connectionString

      # SMTP — set after you have Gmail App Password / Mailgun / SendGrid creds
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false

      # Optional: master API key for programmatic access (X-API-Key header)
      - key: API_KEY
        sync: false

      - key: WEBHOOK_SECRET
        generateValue: true

      - key: TRACKING_DOMAIN
        sync: false

      - key: SEND_RATE_PER_SECOND
        value: "5"
      - key: SEND_RATE_PER_DAY
        value: "2000"

      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"
