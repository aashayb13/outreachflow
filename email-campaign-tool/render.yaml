services:
  - type: web
    name: email-campaign-tool
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: APP_SECRET
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: DB_PATH
        value: /data/campaigns.db
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: TRACKING_DOMAIN
        sync: false
      - key: SEND_RATE_PER_SECOND
        value: "5"
      - key: SEND_RATE_PER_DAY
        value: "2000"
    disk:
      name: email-campaign-data
      mountPath: /data
      sizeGB: 1
